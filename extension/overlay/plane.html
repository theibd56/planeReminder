<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plane Reminder</title>
  <link rel="stylesheet" href="plane.css">
</head>
<body>
  <canvas id="rope-canvas" class="rope-canvas"></canvas>
  <div id="reminder-banner" class="banner" hidden>
    <span class="banner__label"></span>
    <span class="banner__title"></span>
    <span class="banner__time"></span>
  </div>
  <svg id="paper-plane" class="paper-plane" viewBox="0 0 120 60" hidden aria-hidden="true">
    <defs>
      <linearGradient id="near-wing-gradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#e8eef8"/>
      </linearGradient>
      <linearGradient id="far-wing-gradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#c9d6ea"/>
        <stop offset="1" stop-color="#e4ebf6"/>
      </linearGradient>
      <linearGradient id="keel-gradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9fb3d4"/>
        <stop offset="1" stop-color="#7f97c0"/>
      </linearGradient>
    </defs>
    <polygon fill="url(#far-wing-gradient)" points="118,26 8,4 48,29"/>
    <polygon fill="url(#keel-gradient)" points="118,26 48,29 40,50"/>
    <polygon fill="url(#near-wing-gradient)" points="118,26 2,36 48,29"/>
    <g fill="none" stroke="#2b4a7a" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
      <polyline points="48,29 8,4 118,26 2,36 48,29 40,50 118,26"/>
      <line x1="48" y1="29" x2="118" y2="26" stroke-opacity=".45"/>
    </g>
  </svg>
  <p id="demo-mode-hint" class="demo-mode-hint" hidden>
    Click to replay · ?kind=at-start&amp;title=…&amp;time=…&amp;lang=ru|en|zh&amp;freezeAt=3
  </p>
  <script src="plane.js"></script>
</body>
</html>
